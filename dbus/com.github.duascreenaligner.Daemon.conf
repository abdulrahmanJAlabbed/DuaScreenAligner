<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own the daemon bus name -->
  <policy user="root">
    <allow own="com.github.duascreenaligner.Daemon"/>
  </policy>

  <!-- Allow any local user to call daemon methods and receive signals -->
  <policy context="default">
    <allow send_destination="com.github.duascreenaligner.Daemon"/>
    <allow receive_sender="com.github.duascreenaligner.Daemon"/>
  </policy>
</busconfig>
