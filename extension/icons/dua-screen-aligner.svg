<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- DuaScreen Aligner: two displays (portrait + landscape, offset) showing
       one physically-continuous wallpaper across the bezel gap. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6db3f2"/>
      <stop offset="1" stop-color="#f7d774"/>
    </linearGradient>
    <clipPath id="scrL"><rect x="20" y="30" width="34" height="68" rx="2"/></clipPath>
    <clipPath id="scrR"><rect x="70" y="48" width="44" height="32" rx="2"/></clipPath>
    <!-- One scene, in a single coordinate space. Each screen reveals its slice
         so the ridge line stays continuous across the gap. -->
    <g id="scene">
      <rect x="8" y="18" width="114" height="94" fill="url(#sky)"/>
      <circle cx="100" cy="58" r="8" fill="#fff2b0"/>
      <path d="M8 100 L40 60 L68 94 L96 56 L122 100 Z" fill="#3f7a5a"/>
      <path d="M8 102 L36 76 L64 102 Z" fill="#2f5f46"/>
    </g>
  </defs>

  <!-- portrait display (left) -->
  <rect x="14" y="24" width="46" height="80" rx="6" fill="#2b2f36"/>
  <use href="#scene" clip-path="url(#scrL)"/>
  <rect x="33" y="104" width="8" height="9" rx="1.5" fill="#2b2f36"/>

  <!-- landscape display (right, dropped like a seam-aligned primary) -->
  <rect x="64" y="42" width="56" height="44" rx="6" fill="#2b2f36"/>
  <use href="#scene" clip-path="url(#scrR)"/>
  <rect x="88" y="86" width="8" height="10" rx="1.5" fill="#2b2f36"/>
</svg>
